<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmaciones - Plan y Fiesta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="admin.js?v=4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }

        /* ================= FILTROS ================= */
        .pestana {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 8px; border-radius: 12px; font-size: 14px; font-weight: 700; color: #64748b;
            transition: background .15s, color .15s;
        }
        .pestana:hover { background: #f8fafc; color: #334155; }
        .pestana .cuenta { font-size: 12px; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: #f1f5f9; color: #64748b; }
        .pestana.activa[data-tab="todas"] { background: #eef2ff; color: #4338ca; box-shadow: inset 0 0 0 1px #c7d2fe; }
        .pestana.activa[data-tab="todas"] .cuenta { background: #4f46e5; color: #fff; }
        .pestana.activa[data-tab="si"] { background: #f0fdf4; color: #15803d; box-shadow: inset 0 0 0 1px #bbf7d0; }
        .pestana.activa[data-tab="si"] .cuenta { background: #16a34a; color: #fff; }
        .pestana.activa[data-tab="no"] { background: #fef2f2; color: #b91c1c; box-shadow: inset 0 0 0 1px #fecaca; }
        .pestana.activa[data-tab="no"] .cuenta { background: #dc2626; color: #fff; }
        @media (max-width: 640px) {
            .pestana { flex-direction: column; gap: 3px; padding: 10px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
        }

        /* ================= TABLA (computadora) ================= */
        .hoja { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
        .hoja thead th {
            background: #f8fafc; color: #64748b;
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
            padding: 10px 12px; text-align: left; white-space: nowrap;
            border-bottom: 2px solid #e2e8f0;
        }
        .hoja thead th.centro { text-align: center; }
        .hoja td { padding: 10px 12px; border-bottom: 1px solid #eef2f7; vertical-align: middle; background: #fff; }
        .hoja tbody tr:nth-child(even) td { background: #fcfdfe; }
        .hoja tbody tr:hover td { background: #f5f7ff; }
        .hoja .centro { text-align: center; }

        .codigo { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-weight: 700; color: #4338ca; letter-spacing: .06em; font-size: 12px; }
        .nombre { font-weight: 700; color: #0f172a; overflow-wrap: anywhere; }
        .nombres { color: #64748b; font-size: 13px; white-space: pre-line; overflow-wrap: anywhere; max-width: 260px; }
        .mensaje { color: #64748b; font-size: 13px; font-style: italic; white-space: pre-line; overflow-wrap: anywhere; max-width: 380px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .pastilla-total { display: inline-block; min-width: 34px; padding: 3px 8px; border-radius: 8px; font-weight: 800; }
        .insignia { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }

        .c-acciones { width: 1%; white-space: nowrap; }
        .acciones { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
        .btn-accion {
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            font-size: 12px; font-weight: 700; border-radius: 8px; padding: 7px 10px; white-space: nowrap;
            border: 1px solid; transition: background .15s, transform .1s;
        }
        .btn-accion:active { transform: scale(.97); }
        .btn-accion i { font-size: 15px; }
        .btn-accion:disabled { opacity: .5; cursor: wait; }
        .btn-editar { color: #334155; background: #f8fafc; border-color: #e2e8f0; }
        .btn-editar:hover { background: #f1f5f9; }

        /* Ventana de edición */
        .campo-etq { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px; }
        .campo {
            width: 100%; border: 1px solid #e2e8f0; border-radius: 10px; background: #f8fafc; color: #0f172a;
            padding: 10px 11px; font-size: 16px; outline: none; transition: border-color .15s, box-shadow .15s, background .15s;
        }
        .campo:focus { border-color: #6366f1; background: #fff; box-shadow: 0 0 0 3px #c7d2fe; }
        textarea.campo { resize: vertical; min-height: 76px; line-height: 1.4; }
        .opcion-asistencia input { position: absolute; opacity: 0; pointer-events: none; }
        .opcion-asistencia span {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 11px 8px; border: 1px solid #e2e8f0; border-radius: 12px;
            font-weight: 700; font-size: 14px; color: #64748b; cursor: pointer; transition: all .15s;
        }
        .opcion-asistencia input:checked + span.si { background: #f0fdf4; border-color: #22c55e; color: #15803d; box-shadow: 0 0 0 1px #22c55e; }
        .opcion-asistencia input:checked + span.no { background: #fef2f2; border-color: #ef4444; color: #b91c1c; box-shadow: 0 0 0 1px #ef4444; }
        .opcion-asistencia input:focus-visible + span { outline: 2px solid #6366f1; outline-offset: 2px; }
        .btn-qr { color: #15803d; background: #f0fdf4; border-color: #bbf7d0; }
        .btn-qr:hover { background: #dcfce7; }
        .btn-borrar { color: #b91c1c; background: #fef2f2; border-color: #fecaca; }
        .btn-borrar:hover { background: #fee2e2; }

        /* Fila nueva que llegó con la actualización en vivo */
        @keyframes resaltar { from { background-color: #fef9c3; } to { background-color: transparent; } }
        .hoja tr.cambio td { animation: resaltar 3s ease-out; }

        /* ================= TARJETAS (celular / tableta vertical) ================= */
        @media (max-width: 1024px) {
            .hoja, .hoja tbody { display: block; }
            .hoja thead { display: none; }
            .hoja tbody tr {
                display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 8px;
                background: #fff; border: 1px solid #e2e8f0; border-radius: 16px;
                padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
            }
            .hoja tbody tr td, .hoja tbody tr:nth-child(even) td, .hoja tbody tr:hover td { background: transparent; border: 0; padding: 0; min-width: 0; }
            .hoja tr.cambio { animation: resaltar 3s ease-out; }
            .hoja tr.cambio td { animation: none; }
            .hoja td[data-label]::before {
                content: attr(data-label); display: block; margin: 0 0 4px;
                font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .05em;
            }
            .hoja .c-nombre, .hoja .c-nombres, .hoja .c-mensaje, .hoja .c-fecha, .hoja .c-acciones { grid-column: 1 / -1; }
            .nombres { max-width: none; font-size: 14px; }
            .hoja .centro { text-align: left; }
            .hoja .c-acciones { width: auto; }
            .acciones { flex-direction: row; justify-content: stretch; }
            .acciones .btn-accion { flex: 1; padding: 11px 8px; font-size: 13px; }
            .nombre { font-size: 16px; }
            .mensaje { max-width: none; font-size: 14px; -webkit-line-clamp: 8; }
            .hoja tr.sin-filas { display: block; text-align: center; }
        }

        /* ================= INDICADOR EN VIVO Y AVISOS ================= */
        .punto-vivo { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; position: relative; flex: none; }
        .punto-vivo::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #22c55e; animation: pulso 2s ease-out infinite; }
        .punto-vivo.pausa { background: #94a3b8; }
        .punto-vivo.pausa::after { display: none; }
        .punto-vivo.error { background: #ef4444; }
        .punto-vivo.error::after { background: #ef4444; }
        @keyframes pulso { from { transform: scale(1); opacity: .7; } to { transform: scale(2.6); opacity: 0; } }

        #toast {
            position: fixed; z-index: 70; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
            opacity: 0; pointer-events: none; transition: all .25s;
            background: #0f172a; color: #fff; border-radius: 12px; padding: 12px 16px;
            display: flex; align-items: center; gap: 10px; font-size: 14px; max-width: calc(100vw - 24px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .5);
        }
        #toast.visible { opacity: 1; transform: translate(-50%, 0); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <div class="max-w-[1200px] mx-auto p-4 md:p-6 space-y-6 pb-20">

        <!-- ENCABEZADO -->
        <header class="flex flex-col lg:flex-row justify-between lg:items-center bg-white p-5 md:p-6 rounded-2xl shadow-sm gap-5">
            <div class="flex flex-col gap-2 min-w-0">
                <a href="panel.html" class="text-xs font-semibold text-slate-400 hover:text-indigo-600 flex items-center gap-1 w-fit">
                    <i class="ph ph-arrow-left"></i> Panel de control
                </a>
                <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Confirmaciones</h1>
                <div class="flex flex-wrap items-center gap-3">
                    <button id="btnRefresh" onclick="cargar()" class="w-fit flex items-center gap-2 bg-blue-50 text-blue-600 border border-blue-200 px-3 py-1.5 rounded-lg hover:bg-blue-100 transition font-bold text-xs">
                        <i id="iconRefresh" class="ph ph-arrows-clockwise text-lg"></i>
                        <span>Actualizar</span>
                    </button>
                    <span class="flex items-center gap-2 text-xs font-semibold text-slate-500" title="La página revisa si hay respuestas nuevas cada 15 segundos mientras está abierta">
                        <span id="puntoVivo" class="punto-vivo pausa"></span>
                        <span id="textoVivo">Conectando…</span>
                    </span>
                </div>
            </div>

            <div class="flex items-center gap-4 bg-green-50 px-5 py-3 rounded-xl border border-green-100">
                <div class="text-right flex-1">
                    <p class="text-xs text-green-600 font-bold uppercase">Personas que asistirán</p>
                    <p id="resumenPersonas" class="text-3xl font-bold text-green-700">0</p>
                </div>
                <div class="h-12 w-12 rounded-full bg-green-100 flex items-center justify-center text-green-600">
                    <i class="ph ph-users-three text-2xl"></i>
                </div>
            </div>
        </header>

        <!-- FILTROS -->
        <nav class="bg-white p-1.5 rounded-2xl shadow-sm flex gap-1.5">
            <button class="pestana activa" data-tab="todas" onclick="cambiarTab('todas')">
                <i class="ph ph-list text-xl"></i><span>Todas</span><span class="cuenta" id="cuenta-todas">0</span>
            </button>
            <button class="pestana" data-tab="si" onclick="cambiarTab('si')">
                <i class="ph ph-check-circle text-xl"></i><span>Sí asistirán</span><span class="cuenta" id="cuenta-si">0</span>
            </button>
            <button class="pestana" data-tab="no" onclick="cambiarTab('no')">
                <i class="ph ph-x-circle text-xl"></i><span>No asistirán</span><span class="cuenta" id="cuenta-no">0</span>
            </button>
        </nav>

        <!-- BÚSQUEDA -->
        <div class="bg-white p-3 md:p-4 rounded-2xl shadow-sm sticky top-2 z-20 border border-slate-200 flex items-center gap-3">
            <div class="relative flex-1">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                <input type="search" id="buscar" autocomplete="off"
                    class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-xl bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-base"
                    placeholder="Buscar por nombre, código o mensaje...">
            </div>
            <span id="contadorVisible" class="text-xs text-slate-400 whitespace-nowrap hidden md:inline"></span>
        </div>

        <!-- LISTADO -->
        <div class="bg-white md:rounded-2xl md:shadow-sm md:border md:border-slate-200 overflow-hidden max-[1024px]:bg-transparent">
            <div class="overflow-x-auto max-[1024px]:overflow-visible">
                <table class="hoja">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th class="centro">Asistencia</th>
                            <th class="centro">Personas</th>
                            <th>Nombres</th>
                            <th>Felicitación</th>
                            <th>Fecha</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tabla-cuerpo">
                        <tr class="sin-filas"><td colspan="8" class="text-center py-10 text-slate-400 animate-pulse">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- VENTANA: EDITAR RESPUESTA -->
    <div id="modalEditar" class="hidden fixed inset-0 z-50 bg-slate-900/40 flex items-end sm:items-center justify-center sm:p-4" role="dialog" aria-modal="true" aria-labelledby="editarTitulo">
        <form id="formEditar" class="bg-white w-full sm:max-w-lg max-h-[92vh] rounded-t-2xl sm:rounded-2xl shadow-xl flex flex-col" novalidate>
            <div class="px-5 py-4 border-b border-slate-100 flex items-start justify-between gap-3">
                <div class="min-w-0">
                    <h3 id="editarTitulo" class="text-lg font-bold text-slate-900">Editar respuesta</h3>
                    <p class="text-xs text-slate-500">Código <span id="editarCodigo" class="codigo"></span></p>
                </div>
                <button type="button" onclick="cerrarEditar()" class="text-slate-400 hover:text-slate-700 p-1" aria-label="Cerrar"><i class="ph-bold ph-x text-xl"></i></button>
            </div>

            <div class="p-5 overflow-y-auto space-y-4">
                <div>
                    <label class="campo-etq" for="editarNombre">Nombre</label>
                    <input class="campo" id="editarNombre" name="nombre" maxlength="150" autocomplete="off">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <label class="opcion-asistencia relative"><input type="radio" name="asistira" value="Si"><span class="si"><i class="ph-bold ph-check"></i> Sí asistirá</span></label>
                    <label class="opcion-asistencia relative"><input type="radio" name="asistira" value="No"><span class="no"><i class="ph-bold ph-x"></i> No asistirá</span></label>
                </div>
                <div id="editarDetalles" class="space-y-4">
                    <div class="w-32">
                        <label class="campo-etq" for="editarCantidad">Personas</label>
                        <input class="campo text-center" id="editarCantidad" name="cantidad" type="number" min="1" max="999" inputmode="numeric">
                    </div>
                    <div>
                        <label class="campo-etq" for="editarNombres">Nombres de los invitados</label>
                        <textarea class="campo" id="editarNombres" name="nombres" maxlength="1000" rows="3"></textarea>
                    </div>
                </div>
                <div>
                    <label class="campo-etq" for="editarMensaje">Felicitación</label>
                    <textarea class="campo" id="editarMensaje" name="mensaje" maxlength="2000" rows="3"></textarea>
                </div>
                <p id="editarError" class="hidden text-sm font-semibold text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></p>
            </div>

            <div class="px-5 py-4 border-t border-slate-100 grid grid-cols-2 sm:flex sm:justify-end gap-2">
                <button type="button" onclick="cerrarEditar()" class="px-4 py-2.5 rounded-xl font-bold text-sm text-slate-600 bg-slate-100 hover:bg-slate-200 transition">Cancelar</button>
                <button type="submit" id="btnGuardar" class="px-5 py-2.5 rounded-xl font-bold text-sm text-white bg-indigo-600 hover:bg-indigo-700 transition flex items-center justify-center gap-2 disabled:opacity-60">
                    <i class="ph-bold ph-floppy-disk"></i> Guardar
                </button>
            </div>
        </form>
    </div>

    <div id="toast" role="status" aria-live="polite"><i class="ph-fill ph-bell-ringing text-green-400 text-lg"></i><span id="toastTexto"></span></div>

    <script>
        let respuestas = [];
        let tab = 'todas';
        let version = null;
        let conocidos = null;      // ids ya mostrados (para resaltar los nuevos)
        let nuevos = new Set();

        document.getElementById('buscar').addEventListener('input', pintar);
        document.getElementById('tabla-cuerpo').addEventListener('click', e => {
            const copiar = e.target.closest('[data-copiar]');
            if (copiar) return copiarConAviso(copiar, copiar.dataset.copiar);
            const borrar = e.target.closest('[data-borrar]');
            if (borrar) return borrarRespuesta(borrar);
            const editar = e.target.closest('[data-editar]');
            if (editar) abrirEditar(editar.dataset.editar);
        });

        cargar();

        async function cargar() {
            const icono = document.getElementById('iconRefresh');
            icono.classList.add('animate-spin');
            try {
                const datos = await apiAdmin('confirmados');
                version = datos.version;
                respuestas = datos.confirmados.slice().sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));

                const ids = new Set(respuestas.map(r => r.id));
                nuevos = new Set(conocidos ? [...ids].filter(id => !conocidos.has(id)) : []);
                if (nuevos.size) {
                    const primero = respuestas.find(r => nuevos.has(r.id));
                    mostrarToast(nuevos.size === 1
                        ? `${primero.nombre} ${primero.asistira === 'Si' ? 'confirmó que asistirá' : 'avisó que no asistirá'}`
                        : `${nuevos.size} respuestas nuevas`);
                }
                conocidos = ids;

                const r = datos.resumen;
                document.getElementById('resumenPersonas').textContent = r.personas;
                document.getElementById('cuenta-todas').textContent = r.respuestas;
                document.getElementById('cuenta-si').textContent = r.si;
                document.getElementById('cuenta-no').textContent = r.no;
                estadoVivo('ok');
                pintar();
            } catch (error) {
                estadoVivo('error');
                if (!respuestas.length) {
                    document.getElementById('tabla-cuerpo').innerHTML =
                        `<tr class="sin-filas"><td colspan="8" class="text-center py-10 text-red-500">No se pudieron cargar los datos: ${esc(error.message)}</td></tr>`;
                }
            } finally {
                icono.classList.remove('animate-spin');
            }
        }

        function cambiarTab(nuevo) {
            tab = nuevo;
            document.querySelectorAll('.pestana').forEach(b => b.classList.toggle('activa', b.dataset.tab === tab));
            pintar();
        }

        function pintar() {
            const q = document.getElementById('buscar').value.trim().toLowerCase();
            const lista = respuestas.filter(r =>
                (tab === 'todas' || (tab === 'si') === (r.asistira === 'Si')) &&
                (!q || `${r.id} ${r.nombre} ${r.nombres || ''} ${r.mensaje}`.toLowerCase().includes(q)));

            document.getElementById('contadorVisible').textContent = `${lista.length} de ${respuestas.length}`;
            const cuerpo = document.getElementById('tabla-cuerpo');
            if (!lista.length) {
                cuerpo.innerHTML = `<tr class="sin-filas"><td colspan="8" class="text-center py-10 text-slate-400">${
                    respuestas.length ? 'No hay respuestas que coincidan.' : 'Aún no hay respuestas. Comparte el link de la invitación desde el panel.'}</td></tr>`;
                return;
            }

            cuerpo.innerHTML = lista.map(r => {
                const si = r.asistira === 'Si';
                const mensaje = String(r.mensaje || '').trim();
                const nombres = String(r.nombres || '').trim();
                return `
                <tr class="${nuevos.has(r.id) ? 'cambio' : ''}">
                    <td data-label="Código"><span class="codigo">${esc(r.id)}</span></td>
                    <td class="c-nombre" data-label="Nombre"><span class="nombre">${esc(r.nombre)}</span></td>
                    <td class="centro" data-label="Asistencia">
                        <span class="insignia ${si ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                            <i class="ph-bold ${si ? 'ph-check' : 'ph-x'}"></i> ${si ? 'Sí' : 'No'}
                        </span>
                    </td>
                    <td class="centro" data-label="Personas">
                        <span class="pastilla-total ${si ? 'bg-indigo-50 text-indigo-700' : 'bg-slate-100 text-slate-400'}">${num(r.cantidad)}</span>
                    </td>
                    <td class="c-nombres" data-label="Nombres">${nombres ? `<p class="nombres">${esc(nombres)}</p>` : '<span class="text-slate-300">—</span>'}</td>
                    <td class="c-mensaje" data-label="Felicitación">${mensaje ? `<p class="mensaje">“${esc(mensaje)}”</p>` : '<span class="text-slate-300">—</span>'}</td>
                    <td class="c-fecha text-xs text-slate-500 whitespace-nowrap" data-label="Fecha">${esc(fechaLarga(r.fecha, true))}</td>
                    <td class="c-acciones">
                        <div class="acciones">
                            ${si ? `<button type="button" class="btn-accion btn-qr" data-copiar="${esc(linkPase(r.id))}" title="Copia el link del pase con QR"><i class="ph ph-qr-code"></i> Copiar QR</button>` : ''}
                            <button type="button" class="btn-accion btn-editar" data-editar="${esc(r.id)}"><i class="ph ph-pencil-simple"></i> Editar</button>
                            <button type="button" class="btn-accion btn-borrar" data-borrar="${esc(r.id)}" title="Borra toda la respuesta (ej. si está duplicada)"><i class="ph ph-trash"></i> Borrar</button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        async function borrarRespuesta(btn) {
            const r = respuestas.find(x => x.id === btn.dataset.borrar);
            if (!r || !confirm(`¿Borrar la respuesta de «${r.nombre}»? También se borra su felicitación.`)) return;
            btn.disabled = true;
            try {
                await apiAdmin('borrar_confirmacion', { id: r.id });
                await cargar();
            } catch (error) {
                alert('No se pudo borrar: ' + error.message);
                btn.disabled = false;
            }
        }

        // ---------- Editar ----------
        let editando = null;

        function abrirEditar(id) {
            const r = respuestas.find(x => x.id === id);
            if (!r) return;
            editando = r;
            const f = document.getElementById('formEditar');
            document.getElementById('editarCodigo').textContent = r.id;
            f.nombre.value = r.nombre || '';
            f.asistira.value = r.asistira === 'Si' ? 'Si' : 'No';
            f.cantidad.value = num(r.cantidad) || 1;
            f.nombres.value = r.nombres || '';
            f.mensaje.value = r.mensaje || '';
            document.getElementById('editarError').classList.add('hidden');
            mostrarDetalles();
            document.getElementById('modalEditar').classList.remove('hidden');
            f.nombre.focus();
        }

        function cerrarEditar() {
            editando = null;
            document.getElementById('modalEditar').classList.add('hidden');
        }

        function mostrarDetalles() {
            const si = document.getElementById('formEditar').asistira.value === 'Si';
            document.getElementById('editarDetalles').classList.toggle('hidden', !si);
        }

        document.getElementById('formEditar').addEventListener('change', mostrarDetalles);
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && editando) cerrarEditar(); });

        document.getElementById('formEditar').addEventListener('submit', async e => {
            e.preventDefault();
            if (!editando) return;
            const f = e.target;
            const btn = document.getElementById('btnGuardar');
            const error = document.getElementById('editarError');
            error.classList.add('hidden');
            btn.disabled = true;
            try {
                await apiAdmin('editar_confirmacion', {
                    id: editando.id,
                    nombre: f.nombre.value,
                    asistira: f.asistira.value,
                    cantidad: num(f.cantidad.value),
                    nombres: f.nombres.value,
                    mensaje: f.mensaje.value,
                });
                cerrarEditar();
                await cargar();
            } catch (err) {
                error.textContent = err.message;
                error.classList.remove('hidden');
            } finally {
                btn.disabled = false;
            }
        });

        // ---------- En vivo: cada 15 s pregunta la "versión" de los datos (muy ligera) ----------
        function estadoVivo(estado) {
            const punto = document.getElementById('puntoVivo');
            const texto = document.getElementById('textoVivo');
            punto.className = 'punto-vivo' + (estado === 'ok' ? '' : ' ' + estado);
            texto.textContent = estado === 'ok' ? 'En vivo' : estado === 'error' ? 'Sin conexión' : 'En pausa';
        }

        setInterval(async () => {
            if (document.hidden || version === null) return;
            try {
                const res = await apiAdmin('version');
                if (res.version !== version) await cargar();
                else estadoVivo('ok');
            } catch (e) {
                estadoVivo('error');
            }
        }, 15000);

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) estadoVivo('pausa');
            else if (version !== null) cargar();
        });

        let toastTimer = null;
        function mostrarToast(texto) {
            document.getElementById('toastTexto').textContent = texto;
            const toast = document.getElementById('toast');
            toast.classList.add('visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('visible'), 4000);
        }
    </script>
</body>
</html>
