<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Mi confirmación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="admin.js?v=4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .entrar { animation: entrar .35s ease-out both; }
        @keyframes entrar { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- BARRA SUPERIOR -->
    <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-lg">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center gap-3">
            <div class="h-10 w-10 rounded-xl bg-white/10 grid place-items-center shrink-0">
                <i class="ph-fill ph-ticket text-2xl"></i>
            </div>
            <div class="min-w-0">
                <p class="font-extrabold text-lg leading-tight truncate">Mi confirmación</p>
                <p class="text-xs text-slate-400 leading-tight">Datos de tu pase de acceso</p>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-4 pb-16">

        <!-- BUSCAR POR CÓDIGO (por si el QR no se puede leer) -->
        <form id="formBuscar" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-3 flex gap-2">
            <input id="codigo" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false"
                class="mono flex-1 min-w-0 px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 text-xl font-bold uppercase tracking-widest outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
                placeholder="CÓDIGO">
            <button class="px-5 rounded-xl bg-slate-900 text-white font-bold flex items-center gap-2 hover:bg-slate-700 transition">
                <i class="ph-bold ph-magnifying-glass text-lg"></i><span class="hidden sm:inline">Buscar</span>
            </button>
        </form>

        <!-- RESULTADO -->
        <section id="resultado"></section>

        <!-- PIE -->
        <div class="text-center pt-2">
            <button id="btnRefresh" onclick="recargarActual()" class="hidden inline-flex items-center gap-2 text-slate-500 hover:text-indigo-600 text-base font-semibold py-2 px-4">
                <i id="iconRefresh" class="ph ph-arrows-clockwise text-xl"></i>
                <span>Actualizar datos</span>
            </button>
        </div>
    </main>

    <script>
        // Página que se abre al escanear el QR del pase (paseqr.html): escaner.html?id=XXXXX
        // Muestra los datos de la confirmación en letra grande para leerlos rápido.
        // Sin ?id= se puede escribir el código a mano.
        let actual = null; // código que se está viendo

        document.addEventListener('DOMContentLoaded', () => {
            const id = new URLSearchParams(location.search).get('id');
            if (id) cargar(id);
            else document.getElementById('codigo').focus();
        });

        document.getElementById('formBuscar').addEventListener('submit', e => {
            e.preventDefault();
            const id = document.getElementById('codigo').value.trim().toUpperCase();
            if (!id) return;
            history.replaceState(null, '', '?id=' + encodeURIComponent(id));
            cargar(id);
        });

        // ===== CARGA DE DATOS =====

        function recargarActual() {
            if (actual) cargar(actual);
        }

        async function cargar(id) {
            id = String(id).toUpperCase();
            actual = id;
            document.getElementById('codigo').value = id;
            document.getElementById('btnRefresh').classList.remove('hidden');
            document.getElementById('iconRefresh').classList.add('animate-spin');
            pintarCargando(id);
            try {
                const res = await fetch(`api.php?accion=confirmacion&id=${encodeURIComponent(id)}&t=${Date.now()}`, { cache: 'no-store' });
                const data = await res.json().catch(() => ({ ok: false, error: 'Error de conexión.' }));
                if (!data.ok) {
                    if (res.status === 404) pintarError('Código no encontrado', `El código ${id} no existe en las confirmaciones.`);
                    else throw new Error(data.error);
                    return;
                }
                pintarResultado(data.confirmacion);
            } catch (error) {
                console.error(error);
                pintarError('No se pudo cargar', error.message || 'Revisa la conexión a internet.');
            } finally {
                document.getElementById('iconRefresh').classList.remove('animate-spin');
            }
        }

        const COLORES = {
            emerald: 'bg-gradient-to-br from-emerald-500 to-green-600',
            rose:    'bg-gradient-to-br from-rose-500 to-red-600',
        };

        // Los nombres se escriben libres: uno por renglón o separados por comas
        function listaNombres(texto) {
            return String(texto || '').split(/\r?\n|,|;/).map(n => n.trim()).filter(Boolean);
        }

        // ===== PINTAR =====

        function pintarResultado(c) {
            const asiste = c.asistira === 'Si';
            const est = asiste
                ? { color: 'emerald', icono: 'ph-fill ph-check-circle', titulo: 'Asistencia confirmada', detalle: '¡Te esperamos!' }
                : { color: 'rose', icono: 'ph-fill ph-x-circle', titulo: 'No asistirá', detalle: 'Respondió que no podrá asistir' };
            const nombres = listaNombres(c.nombres);

            document.getElementById('resultado').innerHTML = `
                <article class="entrar bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                    <!-- Estado -->
                    <div class="${COLORES[est.color]} text-white px-5 pt-7 pb-6 text-center">
                        <div class="mx-auto h-20 w-20 rounded-full bg-white/20 grid place-items-center">
                            <i class="${est.icono} text-5xl"></i>
                        </div>
                        <h2 class="mt-3 text-3xl sm:text-4xl font-black tracking-tight">${esc(est.titulo)}</h2>
                        <p class="text-white/90 text-lg font-medium mt-1">${esc(est.detalle)}</p>
                    </div>

                    <div class="p-5 space-y-5">
                        <!-- Nombre -->
                        <div class="text-center">
                            <p class="text-sm uppercase tracking-widest font-bold text-slate-400">Confirmación de</p>
                            <h3 class="text-3xl sm:text-4xl font-black text-slate-900 leading-tight break-words mt-1">${esc(c.nombre)}</h3>
                            <p class="mono mt-2 inline-block text-base font-bold text-slate-500 bg-slate-100 rounded-lg px-3 py-1 tracking-widest">${esc(c.id)}</p>
                        </div>

                        ${asiste ? `
                        <!-- Personas -->
                        <div class="rounded-3xl bg-slate-50 border border-slate-200 p-5 text-center">
                            <p class="text-base uppercase tracking-widest font-bold text-slate-400">Personas confirmadas</p>
                            <p class="text-8xl font-black text-slate-800 leading-none mt-2">${num(c.cantidad)}</p>
                        </div>` : ''}

                        ${nombres.length ? `
                        <div class="rounded-3xl bg-slate-50 border border-slate-200 p-5">
                            <p class="text-base uppercase tracking-widest font-bold text-slate-400 mb-3">Nombres</p>
                            <ul class="space-y-2">
                                ${nombres.map(n => `
                                <li class="flex items-start gap-3 text-xl sm:text-2xl font-semibold text-slate-800 break-words">
                                    <i class="ph-fill ph-user-circle text-slate-400 text-2xl sm:text-3xl shrink-0"></i>
                                    <span class="min-w-0">${esc(n)}</span>
                                </li>`).join('')}
                            </ul>
                        </div>` : ''}

                        <div class="text-center text-base text-slate-500">
                            <p><i class="ph ph-calendar-check"></i> Confirmó el <b class="text-slate-700">${esc(fechaLarga(c.fecha, true))}</b></p>
                        </div>
                    </div>
                </article>`;
        }

        function pintarCargando(id) {
            document.getElementById('resultado').innerHTML = `
                <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-10 text-center text-slate-400 text-lg">
                    <i class="ph ph-spinner animate-spin text-5xl block mx-auto mb-3"></i>
                    Buscando <span class="mono font-bold text-slate-600">${esc(id)}</span>...
                </div>`;
        }

        function pintarError(titulo, detalle) {
            document.getElementById('resultado').innerHTML = `
                <article class="entrar bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="${COLORES.rose} text-white px-5 py-8 text-center">
                        <div class="mx-auto h-20 w-20 rounded-full bg-white/20 grid place-items-center"><i class="ph-fill ph-prohibit text-5xl"></i></div>
                        <h2 class="mt-3 text-3xl font-black">${esc(titulo)}</h2>
                        <p class="text-white/90 text-lg mt-1">${esc(detalle)}</p>
                    </div>
                </article>`;
        }
    </script>
</body>
</html>
